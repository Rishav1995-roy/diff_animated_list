name: diff_animated_list
description: "Animated list and grid for Flutter that diffs your data itself: pass a new list and get animated inserts, removals, moves and changes. No manual bookkeeping."
version: 0.0.1
homepage: https://github.com/Rishav1995-roy/diff_animated_list
repository: https://github.com/Rishav1995-roy/diff_animated_list
issue_tracker: https://github.com/Rishav1995-roy/diff_animated_list/issues

topics:
  - animation
  - list
  - listview
  - diff
  - widget

screenshots:
  - description: Shuffling, filtering, adding and removing items with move animations.
    path: doc/demo.gif
  - description: Example app in light mode.
    path: doc/screenshot_light.png
  - description: Example app in dark mode.
    path: doc/screenshot_dark.png

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"
